<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · IT Help Desk</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-md navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">IT Help Desk</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
              aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="index.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="tickets.html">Tickets</a></li>
          <li class="nav-item"><a class="nav-link" href="create.html">New Ticket</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div id="alertArea"></div>

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <h1 class="h3 mb-0">Dashboard</h1>
      <a href="create.html" class="btn btn-primary">+ New Ticket</a>
    </div>

    <div class="row g-3 mb-4">
      <div class="col-6 col-lg">
        <div class="card stat-card border-primary">
          <div class="card-body">
            <div class="text-body-secondary small">Open</div>
            <div class="stat-number" id="countOpen">0</div>
          </div>
        </div>
      </div>
      <div class="col-6 col-lg">
        <div class="card stat-card border-warning">
          <div class="card-body">
            <div class="text-body-secondary small">In Progress</div>
            <div class="stat-number" id="countInProgress">0</div>
          </div>
        </div>
      </div>
      <div class="col-6 col-lg">
        <div class="card stat-card border-success">
          <div class="card-body">
            <div class="text-body-secondary small">Resolved</div>
            <div class="stat-number" id="countResolved">0</div>
          </div>
        </div>
      </div>
      <div class="col-6 col-lg">
        <div class="card stat-card border-dark">
          <div class="card-body">
            <div class="text-body-secondary small">Closed</div>
            <div class="stat-number" id="countClosed">0</div>
          </div>
        </div>
      </div>
      <div class="col-12 col-lg">
        <div class="card stat-card">
          <div class="card-body">
            <div class="text-body-secondary small">Total tickets</div>
            <div class="stat-number" id="countTotal">0</div>
          </div>
        </div>
      </div>
    </div>

    <div class="card border-danger mb-4">
      <div class="card-body d-flex flex-wrap justify-content-between align-items-center gap-2">
        <div>
          <div class="fw-semibold">Open tickets without a technician</div>
          <div class="text-body-secondary small">These need to be assigned before work can start.</div>
        </div>
        <div class="d-flex align-items-center gap-3">
          <span class="stat-number text-danger" id="countOpenUnassigned">0</span>
          <a href="tickets.html?status=Open&technician=unassigned" class="btn btn-outline-danger btn-sm">View them</a>
        </div>
      </div>
    </div>

    <div id="emptyState" class="text-center text-body-secondary py-5 d-none">
      <p class="mb-3">No tickets yet.</p>
      <a href="create.html" class="btn btn-primary">Create your first ticket</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
